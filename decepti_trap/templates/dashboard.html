<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DeceptiTrap — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#141414;color:#d4d4d4;font-family:'Inter',sans-serif;font-size:13px}
.topbar{background:#1a1a1a;border-bottom:1px solid #2a2a2a;padding:0 20px;height:42px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:600;color:#fff}.brand em{color:#e8392a;font-style:normal}
.dot{width:7px;height:7px;background:#4ade80;border-radius:50%;display:inline-block;margin-right:6px}
.status{font-size:11px;color:#555;font-family:'Fira Code',monospace}
.clock{font-family:'Fira Code',monospace;font-size:11px;color:#444}
.main{display:flex;height:calc(100vh - 42px)}
.sidebar{width:170px;background:#181818;border-right:1px solid #222;padding:10px 0;display:flex;flex-direction:column}
.nav-lbl{font-size:10px;color:#3a3a3a;text-transform:uppercase;letter-spacing:1px;padding:10px 14px 4px;font-weight:600}
.nav-item{padding:7px 14px;cursor:pointer;color:#666;font-size:12px;border-left:2px solid transparent;display:flex;align-items:center;gap:8px}
.nav-item:hover{background:#1f1f1f;color:#aaa}
.nav-item.active{color:#e8e8e8;border-left-color:#e8392a;background:#1e1e1e}
.sb-bottom{margin-top:auto;padding:12px;border-top:1px solid #222;font-family:'Fira Code',monospace;font-size:10px;color:#3a3a3a;line-height:2}
.sb-bottom span{color:#555}
.content{flex:1;overflow-y:auto;padding:16px}
.panel{display:none}.panel.active{display:block}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:#1a1a1a;border:1px solid #242424;padding:12px 14px}
.stat .lbl{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;font-weight:600}
.stat .val{font-size:22px;font-weight:600;font-family:'Fira Code',monospace;color:#e2e2e2}
.stat .sub{font-size:10px;color:#444;margin-top:4px;font-family:'Fira Code',monospace}
.stat.hot .val{color:#e8392a}
.card{background:#1a1a1a;border:1px solid #242424;padding:12px;margin-bottom:12px}
.card-head{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
.card-head .right{font-family:'Fira Code',monospace;font-size:10px;color:#e8392a;font-weight:400;text-transform:none;letter-spacing:0}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
table{width:100%;border-collapse:collapse;font-family:'Fira Code',monospace;font-size:11px}
th{text-align:left;color:#444;padding:4px 8px 6px;border-bottom:1px solid #222;font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:500}
td{padding:5px 8px;color:#777;border-bottom:1px solid #1e1e1e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
tr:hover td{background:#1c1c1c;color:#999}
td.ip{color:#7aa2c8}
td.page{color:#aaa}
td.extra{color:#666;font-size:10px}
td.hot{color:#e8392a}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-family:'Fira Code',monospace;font-size:11px}
.bar-name{width:120px;color:#666;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:5px;background:#222}
.bar-fill{height:100%;background:#e8392a;transition:width .5s}
.bar-cnt{width:30px;color:#888;text-align:right}
.new-row{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;background:#1a2a1a}to{opacity:1}}
</style>
</head>
<body>
<div class="topbar">
  <span class="brand">Decepi<em>Trap</em></span>
  <div><span class="dot"></span><span class="status">honeypot active</span></div>
  <span class="clock" id="clk"></span>
</div>
<div class="main">
  <div class="sidebar">
    <div class="nav-lbl">monitor</div>
    <div class="nav-item active" onclick="nav(this,'overview')">▣ overview</div>
    <div class="nav-item" onclick="nav(this,'logs')">≡ all logs</div>
    <div class="sb-bottom">
      total <span id="sb-total">0</span><br>
      ips <span id="sb-ips">0</span><br>
      db rows <span id="sb-rows">0</span>
    </div>
  </div>
  <div class="content">

    <!-- OVERVIEW -->
    <div class="panel active" id="panel-overview">
      <div class="stat-row">
        <div class="stat hot"><div class="lbl">total hits</div><div class="val" id="s-total">0</div><div class="sub">all time</div></div>
        <div class="stat"><div class="lbl">unique IPs</div><div class="val" id="s-ips">0</div><div class="sub">attackers</div></div>
        <div class="stat"><div class="lbl">top page</div><div class="val" style="font-size:14px" id="s-tpage">—</div><div class="sub" id="s-tpage-c">0 hits</div></div>
        <div class="stat"><div class="lbl">top IP</div><div class="val" style="font-size:14px" id="s-tip">—</div><div class="sub" id="s-tip-c">0 hits</div></div>
      </div>
      <div class="two-col">
        <div class="card">
          <div class="card-head">hits by page</div>
          <div id="page-bars"></div>
        </div>
        <div class="card">
          <div class="card-head">live feed <span class="right" id="feed-n">0</span></div>
          <table><thead><tr><th>time</th><th>ip</th><th>page</th><th>note</th></tr></thead>
          <tbody id="live-body"></tbody></table>
        </div>
      </div>
    </div>

    <!-- ALL LOGS -->
    <div class="panel" id="panel-logs">
      <div class="card">
        <div class="card-head">attack log <span class="right" id="log-n">0 rows</span></div>
        <div style="overflow-y:auto;max-height:520px">
          <table>
            <thead><tr><th>timestamp</th><th>ip</th><th>page</th><th>method</th><th>user-agent</th><th>extra</th></tr></thead>
            <tbody id="all-body"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>
<script>
function nav(el,name){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-'+name).classList.add('active');
}
function clk(){
  const d=new Date();
  document.getElementById('clk').textContent=
    [d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':');
}
setInterval(clk,1000);clk();

let lastId=0;

async function fetchStats(){
  const r=await fetch('/api/stats');
  const d=await r.json();
  document.getElementById('s-total').textContent=d.total||0;
  document.getElementById('s-ips').textContent=d.unique_ip||0;
  document.getElementById('sb-total').textContent=d.total||0;
  document.getElementById('sb-ips').textContent=d.unique_ip||0;
  document.getElementById('sb-rows').textContent=d.total||0;
  if(d.top_page&&d.top_page.page){
    document.getElementById('s-tpage').textContent=d.top_page.page;
    document.getElementById('s-tpage-c').textContent=d.top_page.c+' hits';
  }
  if(d.top_ip&&d.top_ip.ip){
    document.getElementById('s-tip').textContent=d.top_ip.ip;
    document.getElementById('s-tip-c').textContent=d.top_ip.c+' hits';
  }
  // bars
  if(d.by_page){
    const max=Math.max(...d.by_page.map(r=>r.c),1);
    document.getElementById('page-bars').innerHTML=d.by_page.slice(0,8).map(r=>`
      <div class="bar-row">
        <div class="bar-name">${r.page}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(r.c/max*100)}%"></div></div>
        <div class="bar-cnt">${r.c}</div>
      </div>`).join('');
  }
}

async function fetchAttacks(){
  const r=await fetch('/api/attacks');
  const rows=await r.json();
  if(!rows.length)return;
  // all logs
  const allBody=document.getElementById('all-body');
  allBody.innerHTML=rows.map(r=>`
    <tr>
      <td>${r.timestamp}</td>
      <td class="ip">${r.ip}</td>
      <td class="page">${r.page}</td>
      <td>${r.method}</td>
      <td class="extra">${(r.user_agent||'').substring(0,60)}</td>
      <td class="${r.extra?'hot':''}">${r.extra||''}</td>
    </tr>`).join('');
  document.getElementById('log-n').textContent=rows.length+' rows';
  // live feed — only new
  const newRows=rows.filter(r=>r.id>lastId);
  if(newRows.length){
    lastId=Math.max(...newRows.map(r=>r.id));
    const liveBody=document.getElementById('live-body');
    newRows.forEach(r=>{
      const tr=document.createElement('tr');
      tr.className='new-row';
      tr.innerHTML=`<td>${r.timestamp.slice(11)}</td><td class="ip">${r.ip}</td><td class="page">${r.page}</td><td class="${r.extra?'hot':''}">${r.extra||'visit'}</td>`;
      liveBody.insertBefore(tr,liveBody.firstChild);
    });
    while(liveBody.children.length>10)liveBody.removeChild(liveBody.lastChild);
    document.getElementById('feed-n').textContent=rows.length;
  }
}

async function poll(){await fetchStats();await fetchAttacks();}
poll();
setInterval(poll,4000);
</script>
</body>
</html>
