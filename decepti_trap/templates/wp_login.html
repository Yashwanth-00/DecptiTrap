<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Log In &lsaquo; WordPress</title>
<style>
body{background:#f0f0f1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#login{width:320px;margin:80px auto}
h1 a{display:block;text-align:center;background:url("https://s.w.org/style/images/wp-header-logo.png") no-repeat center;height:84px;margin-bottom:16px;background-size:84px}
#loginform{background:#fff;border:1px solid #c3c4c7;padding:26px;border-radius:3px}
label{display:block;font-size:14px;color:#3c434a;margin-bottom:4px;font-weight:600}
input[type=text],input[type=password]{width:100%;padding:8px;border:1px solid #8c8f94;border-radius:3px;font-size:14px;margin-bottom:16px;box-sizing:border-box}
#wp-submit{background:#2271b1;color:#fff;border:none;padding:9px 18px;border-radius:3px;cursor:pointer;font-size:14px;width:100%}
.err{background:#f0f0f1;border-left:4px solid #d63638;padding:10px;margin-bottom:14px;font-size:13px;color:#3c434a}
</style>
</head>
<body>
<div id="login">
  <h1><a></a></h1>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form id="loginform" method="POST">
    <label for="user_login">Username or Email Address</label>
    <input type="text" name="log" id="user_login" autocomplete="off">
    <label for="user_pass">Password</label>
    <input type="password" name="pwd" id="user_pass">
    <input type="submit" name="wp-submit" id="wp-submit" value="Log In">
  </form>
</div>
</body>
</html>
