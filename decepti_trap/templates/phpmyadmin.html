<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>phpMyAdmin</title>
<style>
body{background:#f5f5f5;font-family:Arial,sans-serif;font-size:13px}
#pma_header{background:#f5f5f5;border-bottom:1px solid #ccc;padding:8px 16px}
#pma_header img{height:22px}
#wrapper{width:380px;margin:60px auto;background:#fff;border:1px solid #ccc;padding:30px;border-radius:2px}
h2{font-size:16px;color:#666;margin-bottom:20px}
label{display:block;color:#555;margin-bottom:4px;font-size:12px}
input{width:100%;padding:7px;border:1px solid #ccc;margin-bottom:14px;font-size:13px;box-sizing:border-box}
select{width:100%;padding:7px;border:1px solid #ccc;margin-bottom:14px;font-size:13px}
button{background:#4a6785;color:#fff;border:none;padding:8px 18px;cursor:pointer;font-size:13px;border-radius:2px}
.err{background:#fef0f0;border:1px solid #d63638;color:#c00;padding:8px;margin-bottom:14px;font-size:12px}
</style>
</head>
<body>
<div id="pma_header"><b>phpMyAdmin</b></div>
<div id="wrapper">
  <h2>Welcome to phpMyAdmin</h2>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="POST">
    <label>Username:</label>
    <input type="text" name="pma_username" value="root">
    <label>Password:</label>
    <input type="password" name="pma_password">
    <label>Server:</label>
    <select><option>127.0.0.1</option></select>
    <button type="submit">Go</button>
  </form>
</div>
</body>
</html>
